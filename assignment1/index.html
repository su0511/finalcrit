<!DOCTYPE html><html lang="en" data-lvt-canonical="1"><!--
--><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>concrete field</title>
  <style>
    :root {
      --paper: #F4F4F2; --ink: #141414; --ui: #8A8A86;
      --mono: "Courier New", Courier, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
    body { cursor: crosshair; }
    canvas { display: block; }
    #ui-overlay {
      position: fixed; inset: 0; pointer-events: none;
      font-family: var(--mono); color: var(--ui); letter-spacing: 0.08em;
    }
    #title {
      position: absolute; top: 22px; left: 24px;
      font-size: 11px; opacity: 0.45; line-height: 1.4; white-space: nowrap;
    }
    #hints {
      position: absolute; bottom: 22px; left: 24px;
      font-size: 10px; opacity: 0.42; line-height: 1.75; white-space: nowrap;
    }
  </style>
</head>
<body>
  <main aria-label="Concrete field, an interactive typographic instrument"></main>
  <div id="ui-overlay" data-lvt-eid="97e17a0b38">
    <div id="title" data-lvt-eid="c4f24f681a">concrete field — a quiet typographic instrument</div>
    <div id="hints" data-lvt-eid="0faba87fda">
      move to disturb the text<br data-lvt-eid="9be367837b">
      hover the edges · click to ripple
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script>
  // ═══════════════════════════════════════════════════════════════
  // 《奥德赛》开篇文本
  // ═══════════════════════════════════════════════════════════════
  const ODYSSEY_TEXT =
    "Tell me, O Muse, of the man of many devices, who wandered full many ways " +
    "after he had sacked the sacred citadel of Troy. Many were the men whose " +
    "cities he saw and whose mind he learned, aye, and many the woes he suffered " +
    "in his heart upon the sea, seeking to win his own life and the return of his comrades.";

  // ═══════════════════════════════════════════════════════════════
  // 配置
  // ═══════════════════════════════════════════════════════════════
  const CFG = {
    inkR: 20, inkG: 20, inkB: 20,
    paperR: 244, paperG: 244, paperB: 242,

    
    TEXT_SIZE: 14,
    TEXT_LINE_CHARS: 52,
    TEXT_LINE_H: 2.0,
    TEXT_CX: 0.42, TEXT_CY: 0.42,
    CHAR_W: 0.601,


    SPRING_K:   0.030,   
    DAMP:       0.84,   
    NOISE_AMP:  0.018,   
    FADEIN:     80,      

  
    DISTURB_R:   110,
    DISTURB_F:   0.28,
    DISTURB_TAN: 0.32,

    
    RIPPLE_R:   155,
    RIPPLE_F:   0.9,
    RIPPLE_TAN: 0.20,

  
    DETACH_R:        62,
    DETACH_COUNT:    6,
    DETACH_FORCE:    2.5,
    DETACH_TAN:      0.82,
    DETACH_COOLDOWN: 90,

    NOISE_SPEED: 0.00012,
  };

  // ═══════════════════════════════════════════════════════════════
  let particles = [];
  let paperGfx  = null;
  let noiseT    = 0;
  let prevMX = 0, prevMY = 0;
  let lastMX = 0, lastMY = 0;
  let detachCooldown = 0;

  let proseHomes = [];

  
  // ═══════════════════════════════════════════════════════════════
  function wrapText(text, maxChars) {
    let words = text.split(' '), lines = [], cur = '';
    for (let w of words) {
      let c = cur.length === 0 ? w : cur + ' ' + w;
      if (c.length <= maxChars) cur = c;
      else { if (cur.length > 0) lines.push(cur); cur = w; }
    }
    if (cur.length > 0) lines.push(cur);
    return lines;
  }


  // ═══════════════════════════════════════════════════════════════
  function computeProseHomes() {
    // Narrow screens need a shorter measure so the field remains fully visible.
    let fs = width < 560 ? 12 : CFG.TEXT_SIZE;
    let maxChars = width < 560 ? max(28, floor((width - 48) / (fs * CFG.CHAR_W))) : CFG.TEXT_LINE_CHARS;
    let lh = fs * CFG.TEXT_LINE_H, cw = fs * CFG.CHAR_W;
    let lines = wrapText(ODYSSEY_TEXT, maxChars);
    let totalH = lines.length * lh;
    let maxLen = 0;
    for (let l of lines) maxLen = max(maxLen, l.length);
    let blockW = maxLen * cw;
    let sideInset = width < 560 ? 24 : 40;
    let ox = constrain(width * CFG.TEXT_CX - blockW * 0.5, sideInset, max(sideInset, width - blockW - sideInset));
    let oy = max(60, height * CFG.TEXT_CY - totalH * 0.5);

    let homes = [];
    for (let li = 0; li < lines.length; li++) {
      let line = lines[li];
      let y = oy + li * lh + fs * 0.5;
      for (let ci = 0; ci < line.length; ci++) {
        let x = ox + ci * cw + cw * 0.5;
        // 边缘判定：首尾行、每行首尾字符、左右边界附近 2.5 字符内
        let isEdge = (li === 0 || li === lines.length - 1 ||
                      ci === 0 || ci === line.length - 1 ||
                      x < ox + cw * 2.5 || x > ox + blockW - cw * 2.5);
        homes.push({ x, y, ch: line[ci], edgeFlag: isEdge });
      }
    }
    // 存储块边界（供脱粒方向参考）
    homes._bounds = { x1: ox, y1: oy, x2: ox + blockW, y2: oy + lines.length * lh };
    return homes;
  }


  // ═══════════════════════════════════════════════════════════════
  function buildPaperGfx() {
    if (paperGfx) paperGfx.remove();
    paperGfx = createGraphics(width, height);
    paperGfx.noStroke();
    for (let i = 7; i >= 0; i--) {
      let t = i / 7;
      let r = lerp(247, 239, t), g = lerp(247, 239, t), b = lerp(245, 237, t);
      let rad = max(width, height) * 0.85 * (1 - t * 0.5);
      paperGfx.fill(r, g, b, 14);
      paperGfx.ellipse(width * 0.5, height * 0.5, rad * 2, rad * 1.6);
    }
  }


  // ═══════════════════════════════════════════════════════════════
  class Particle {
    constructor(hx, hy, ch) {
      this.x = hx; this.y = hy;
      this.vx = 0; this.vy = 0;
      this.homeX = hx; this.homeY = hy;
      this.ch = ch;
      this.nSeedX = random(10000);
      this.nSeedY = random(10000);
      this.edgeFlag = false;
      this.detached = false;
      this.sz = CFG.TEXT_SIZE;
      this.alpha = 0;
      this.targetAlpha = random(0.92, 1.0);
      this.fadeStartFrame = frameCount;
    }
    applySpring(tx, ty, k) {
      this.vx += (tx - this.x) * k;
      this.vy += (ty - this.y) * k;
    }

    applyDisturb(mx, my) {
      let dx = this.x - mx, dy = this.y - my;
      let d = sqrt(dx*dx + dy*dy);
      if (d < CFG.DISTURB_R && d > 0.5) {
        let f = pow(1 - d / CFG.DISTURB_R, 2);
        let nx = dx / d, ny = dy / d;
        this.vx += nx * CFG.DISTURB_F * f * 0.4;
        this.vy += ny * CFG.DISTURB_F * f * 0.4;
        // 固定顺时针切向（-ny, nx）
        this.vx += (-ny) * CFG.DISTURB_TAN * f;
        this.vy += nx  * CFG.DISTURB_TAN * f;
      }
    }

    applyRipple(cx, cy) {
      let dx = this.x - cx, dy = this.y - cy;
      let d = sqrt(dx*dx + dy*dy);
      if (d < CFG.RIPPLE_R && d > 0.5) {
        let f = pow(1 - d / CFG.RIPPLE_R, 3);
        let nx = dx / d, ny = dy / d;
        this.vx += nx * CFG.RIPPLE_F * f;
        this.vy += ny * CFG.RIPPLE_F * f;
        // 
        this.vx += (-ny) * CFG.RIPPLE_TAN * f;
        this.vy += nx  * CFG.RIPPLE_TAN * f;
      }
    }

    detach() {
      if (this.detached) return;
      this.detached = true;
      let bx = proseHomes._bounds ? (proseHomes._bounds.x1 + proseHomes._bounds.x2) * 0.5 : this.homeX;
      let by = proseHomes._bounds ? (proseHomes._bounds.y1 + proseHomes._bounds.y2) * 0.5 : this.homeY;
      let outAngle = atan2(this.homeY - by, this.homeX - bx) + random(-0.5, 0.5);
      let spd = CFG.DETACH_FORCE * random(0.7, 1.3);
      let rad = 1 - CFG.DETACH_TAN;
      this.vx = cos(outAngle) * spd * rad + (-sin(outAngle)) * spd * CFG.DETACH_TAN;
      this.vy = sin(outAngle) * spd * rad + cos(outAngle)  * spd * CFG.DETACH_TAN;
    }

    update() {
      if (this.alpha < this.targetAlpha) {
        let e = frameCount - this.fadeStartFrame;
        this.alpha = min(this.targetAlpha, (e / CFG.FADEIN) * this.targetAlpha);
      }

      let nx = noise(this.nSeedX + noiseT) - 0.5;
      let ny = noise(this.nSeedY + noiseT) - 0.5;
      this.vx += nx * CFG.NOISE_AMP;
      this.vy += ny * CFG.NOISE_AMP;

      let k = this.detached ? CFG.SPRING_K * 0.52 : CFG.SPRING_K;
      this.applySpring(this.homeX, this.homeY, k);

      if (this.detached) {
        let dx = this.homeX - this.x, dy = this.homeY - this.y;
        if (sqrt(dx*dx + dy*dy) < 5) this.detached = false;
      }

      this.vx *= CFG.DAMP; this.vy *= CFG.DAMP;
      let spd = sqrt(this.vx*this.vx + this.vy*this.vy);
      if (spd > 5) { this.vx = this.vx/spd*5; this.vy = this.vy/spd*5; }
      this.x += this.vx; this.y += this.vy;
    }

    draw() {
      let a = this.detached ? this.alpha * 0.70 : this.alpha;
      if (a < 0.01) return;
      fill(CFG.inkR, CFG.inkG, CFG.inkB, a * 255);
      noStroke();
      textSize(this.sz);
      text(this.ch, this.x, this.y);
    }
  }


  // ═══════════════════════════════════════════════════════════════
  function initParticles() {
    particles = [];
    proseHomes = computeProseHomes();
    for (let h of proseHomes) {
      let p = new Particle(h.x, h.y, h.ch);
      p.edgeFlag = h.edgeFlag;
      particles.push(p);
    }
  }


  // ═══════════════════════════════════════════════════════════════
  function tryDetach(mx, my) {
    if (detachCooldown > 0) { detachCooldown--; return; }

   
    let cands = particles.filter(p => p.edgeFlag && !p.detached);


    cands.sort((a, b) => {
      let da = (a.x-mx)*(a.x-mx) + (a.y-my)*(a.y-my);
      let db = (b.x-mx)*(b.x-mx) + (b.y-my)*(b.y-my);
      return da - db;
    });
    let near = cands.filter(p => {
      let d = sqrt((p.x-mx)*(p.x-mx) + (p.y-my)*(p.y-my));
      return d < CFG.DETACH_R;
    });

    if (near.length === 0) return;

    let n = min(CFG.DETACH_COUNT, near.length);
    for (let i = 0; i < n; i++) near[i].detach();
    detachCooldown = CFG.DETACH_COOLDOWN;
  }


  // ═══════════════════════════════════════════════════════════════
  function rebuildOnResize() {
    buildPaperGfx();
    let newHomes = computeProseHomes();
    // 若粒子数量一致，只更新家点（粒子平滑迁移）；否则重建
    if (newHomes.length === particles.length) {
      proseHomes = newHomes;
      for (let i = 0; i < particles.length; i++) {
        particles[i].homeX = newHomes[i].x;
        particles[i].homeY = newHomes[i].y;
        particles[i].edgeFlag = newHomes[i].edgeFlag;
      }
    } else {
      initParticles();
    }
    detachCooldown = 0;
  }


  // ═══════════════════════════════════════════════════════════════
  function setup() {
    let cnv = createCanvas(windowWidth, windowHeight);
    cnv.style('display', 'block');
    textFont('Courier New');
    textAlign(CENTER, CENTER);
    colorMode(RGB, 255);
    buildPaperGfx();
    initParticles();
    prevMX = mouseX; prevMY = mouseY;
    lastMX = width * 0.5; lastMY = height * 0.5;
  }

  function draw() {
    background(CFG.paperR, CFG.paperG, CFG.paperB);
    image(paperGfx, 0, 0);

    noiseT += CFG.NOISE_SPEED;

    let mvX = mouseX - prevMX, mvY = mouseY - prevMY;
    let mv = sqrt(mvX*mvX + mvY*mvY);
    prevMX = mouseX; prevMY = mouseY;

    if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
      lastMX = mouseX; lastMY = mouseY;
    }


    tryDetach(lastMX, lastMY);

    for (let p of particles) {
      if (mv > 0.8) p.applyDisturb(lastMX, lastMY);
      p.update();
    }

    noStroke();
    for (let p of particles) p.draw();
  }

 
  // ═══════════════════════════════════════════════════════════════
  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    rebuildOnResize();
  }


  function mousePressed() {
    if (mouseButton === LEFT) {
      for (let p of particles) p.applyRipple(mouseX, mouseY);
    }
    return false;
  }


  function touchStarted() {
    if (touches.length > 0) {
      let tx = touches[0].x, ty = touches[0].y;
      lastMX = tx; lastMY = ty;
      for (let p of particles) p.applyRipple(tx, ty);
    }
    return false;
  }


  function touchMoved() {
    if (touches.length > 0) {
      let tx = touches[0].x, ty = touches[0].y;
      let dx = tx - lastMX, dy = ty - lastMY;
      let mv = sqrt(dx*dx + dy*dy);
      lastMX = tx; lastMY = ty;
      if (mv > 0.8) for (let p of particles) p.applyDisturb(tx, ty);
      tryDetach(tx, ty);
    }
    return false;
  }
  </script>


</body></html>
